[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guitar0-tgbot"
version = "1.0"
description = "Telegram bot for Guitar 0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiofiles==25.1.0",
    "aiogram==3.31.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "annotated-types==0.8.0",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "frozenlist==1.8.0",
    "idna==3.19",
    "magic-filter==1.0.12",
    "multidict==6.7.1",
    "propcache==0.5.2",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "python-dotenv==1.2.3",
    "resvg-py==0.5.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "yarl==1.24.5",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["db", "routers"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "E501", # line too long
]

[tool.ruff.lint.isort]
known-first-party = ["db", "routers"]

[tool.coverage.run]
source = ["db", "routers", "main.py"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
